name: Java CI — enterprises-management

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests (loadtest y pg-integration excluidos)
        working-directory: Backend/enterprises-management
        run: ./mvnw test --no-transfer-progress
